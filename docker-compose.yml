services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VITE_ADMIN_URL: ${CMS_ORIGIN:?Set CMS_ORIGIN in deploy/production.env}/hello
    restart: unless-stopped
    logging: &bounded-logs
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in deploy/production.env}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-tekkatha}
      PUBLIC_SITE_URL: ${SITE_ORIGIN:?Set SITE_ORIGIN in deploy/production.env}
      ALLOWED_ORIGINS: ${SITE_ORIGIN:?Set SITE_ORIGIN in deploy/production.env},${CMS_ORIGIN:?Set CMS_ORIGIN in deploy/production.env}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_BASE_URL: ${AI_BASE_URL:-https://ai.shahnishant.com.np}
      AI_ALLOWED_HOST: ${AI_ALLOWED_HOST:-ai.shahnishant.com.np}
      AI_MODEL: ${AI_MODEL:-llama-3.2-3b}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      AI_MAX_PRODUCTS: ${AI_MAX_PRODUCTS:-6}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-700}
    networks:
      - private
      - outbound
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 6s
      start_period: 15s
      retries: 3

  site:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: /api
        VITE_ADMIN_URL: ${CMS_ORIGIN:?Set CMS_ORIGIN in deploy/production.env}/hello
    restart: unless-stopped
    logging: *bounded-logs
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - private

  cms:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        VITE_API_BASE: /api
        VITE_WEBSITE_URL: ${SITE_ORIGIN:?Set SITE_ORIGIN in deploy/production.env}
    restart: unless-stopped
    logging: *bounded-logs
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - private

networks:
  private:
    internal: true
  outbound:
    driver: bridge
